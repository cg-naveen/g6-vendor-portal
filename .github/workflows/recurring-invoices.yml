name: Generate Recurring Invoices

on:
  schedule:
    # Runs daily at 01:00 UTC. Safe to run more/less often — the endpoint only
    # bills vendors whose nextBillingDate has actually arrived.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  run-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recurring billing endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${{ vars.APP_URL }}/api/cron/generate-recurring-invoices" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "Recurring billing request failed"
            exit 1
          fi
